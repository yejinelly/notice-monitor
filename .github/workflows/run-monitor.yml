name: Run Notice Monitor

on:
  schedule:
    # GitHub Actions cron uses UTC: 10:05 and 14:05 in Korea.
    - cron: "5 1,5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
      GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
      PILOT_END_AT: "2026-10-30T23:59:59+09:00"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create OAuth files for this one run
        run: |
          python -c "from pathlib import Path; import os; Path('credentials.json').write_text(os.environ['GMAIL_CREDENTIALS_JSON'])"
          python -c "from pathlib import Path; import os; Path('token.json').write_text(os.environ['GMAIL_TOKEN_JSON'])"
      - name: Check subscriptions and send alerts
        run: python runner.py
