name: Run Notice Monitor

on:
  # Read-only diagnostic run. Public notifications are sent by one configured
  # runner only, so a cloud run cannot record an empty result first.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PILOT_END_AT: "2026-10-30T23:59:59+09:00"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check subscriptions without changing records
        run: python runner.py --force --no-send
